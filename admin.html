<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUINA AI 予想データ変換・Web表示ツール</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; background: #f8f9fa; }
    textarea { width: 100%; height: 200px; font-size: 14px; padding: 10px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; margin: 10px 0; }
    button:hover { background: #0056b3; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 20px; }
    .mark-honmei { color: #d9534f; font-weight: bold; font-size: 1.2em; }
    .factor-box { background: #f1f3f5; padding: 10px 15px; border-left: 4px solid #007bff; margin: 10px 0; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>🤖 KUINA AI 予想テキストコピペ・変換ツール</h2>
  <p>PCで出力されたKUINA AIのテキストを下に貼り付けて「Web用デザインに変換」を押してください。</p>

  <textarea id="aiInput" placeholder="KUINA AIの出力テキストをここにコピペ..."></textarea>
  <button onclick="convertAI()">Web表示用に整形する</button>

  <hr>

  <h3>📱 Webサイト表示プレビュー</h3>
  <div id="outputCard" class="card">
    <p style="color: #888;">ここに自動整形されたカードが表示されます。</p>
  </div>

  <script>
    function convertAI() {
      const text = document.getElementById('aiInput').value;
      if (!text.trim()) return alert('テキストを貼り付けてください');

      // 改行を<br>に変換し、装飾を加える簡易処理
      let formatted = text
        .replace(/💎(.+)/g, '<h3 style="color:#2b6cb0; border-bottom:2px solid #2b6cb0; padding-bottom:5px;">💎 $1</h3>')
        .replace(/🥇 ◎ (.+)/g, '<p class="mark-honmei">🥇 ◎ $1</p>')
        .replace(/📊【(.+)】/g, '<h4>📊 $1</h4>')
        .replace(/(1\.|2\.|3\.|4\.|5\.|6\.) (.+)/g, '<div class="factor-box"><strong>$1 $2</strong></div>')
        .replace(/🎯【(.+)】/g, '<h4 style="color:#c53030;">🎯 $1</h4>')
        .replace(/\n/g, '<br>');

      document.getElementById('outputCard').innerHTML = formatted;
    }
  </script>

</body>
</html>
